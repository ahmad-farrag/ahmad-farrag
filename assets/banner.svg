<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ahmed Farrag, Unreal Engine C++, Digital Twins, Real-time AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090F"/>
      <stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.75" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .scan{animation:sweep 6s linear infinite}
      @keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
      .node{animation:pulse 3s ease-in-out infinite}
      .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}.n5{animation-delay:2.4s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.scan,.node{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- city skyline wireframe, nod to digital twins -->
  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.9">
    <path d="M760 300V190h40v110M810 300V140h50v160M870 300V210h30v90M910 300V110h44v190M964 300V170h56v130M1030 300V200h36v100M1076 300V130h48v170M1134 300V220h40v80"/>
    <path d="M932 110V80M1100 130V95" />
  </g>
  <g fill="url(#accent)">
    <circle class="node" cx="835" cy="140" r="4"/>
    <circle class="node n2" cx="932" cy="80" r="4"/>
    <circle class="node n3" cx="992" cy="170" r="4"/>
    <circle class="node n4" cx="1100" cy="95" r="4"/>
    <circle class="node n5" cx="1154" cy="220" r="4"/>
  </g>
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" fill="none">
    <path d="M835 140L932 80L992 170L1100 95L1154 220"/>
  </g>

  <rect class="scan" x="0" y="0" width="160" height="300" fill="url(#scan)"/>

  <text class="t" x="64" y="118" font-size="56" font-weight="700" fill="#F8FAFC">Ahmed Farrag</text>
  <rect x="64" y="138" width="88" height="4" rx="2" fill="url(#accent)"/>
  <text class="t" x="64" y="184" font-size="24" fill="#CBD5E1">Unreal Engine C++  ·  Digital Twins  ·  Real-time AI</text>
  <text class="t" x="64" y="226" font-size="17" fill="#64748B" letter-spacing="1.5">TECHNICAL MANAGER  ·  EPIC GOLD INSTRUCTOR PARTNER  ·  DUBAI</text>
</svg>
